  <text x="270" y="224" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">凡例：上層＝砂岩（黄） ／ 赤帯＝凝灰岩（火山灰・鍵層：厚さ5m） ／ 下層＝泥岩（灰）</text>
  

