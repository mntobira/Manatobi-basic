<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 245" width="540" height="245" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>2クラスの読書時間データの箱ひげ図比較</title>
  <rect width="540" height="245" rx="12" fill="#fffdf9" stroke="#e4d9c5" stroke-width="2"/>
  <text x="270" y="25" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">【1組（35人）と2組（35人）の1週間の読書時間の箱ひげ図】</text>

  <!-- 横軸目盛: 0〜50分 (x = 70 + min * 8.4) -->
  <!-- 0->70, 10->154, 15->196, 20->238, 25->280, 30->322, 35->364, 40->406, 45->448, 50->490 -->
  <line x1="70" y1="196" x2="498" y2="196" stroke="#334155" stroke-width="2"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="45" x2="70" y2="196"/>
    <line x1="154" y1="45" x2="154" y2="196"/>
    <line x1="196" y1="45" x2="196" y2="196" stroke-dasharray="3 3"/>
    <line x1="238" y1="45" x2="238" y2="196"/>
    <line x1="280" y1="45" x2="280" y2="196" stroke-dasharray="3 3"/>
    <line x1="322" y1="45" x2="322" y2="196"/>
    <line x1="364" y1="45" x2="364" y2="196" stroke-dasharray="3 3"/>
    <line x1="406" y1="45" x2="406" y2="196"/>
    <line x1="448" y1="45" x2="448" y2="196" stroke-dasharray="3 3"/>
    <line x1="490" y1="45" x2="490" y2="196"/>
  </g>

  <g font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="70" y="214">0</text>
    <text x="154" y="214">10</text>
    <text x="196" y="214">15</text>
    <text x="238" y="214">20</text>
    <text x="280" y="214">25</text>
    <text x="322" y="214">30</text>
    <text x="364" y="214">35</text>
    <text x="406" y="214">40</text>
    <text x="448" y="214">45</text>
    <text x="490" y="214">50</text>
    <text x="280" y="234" font-size="12" font-weight="800">読書時間（分）</text>
  </g>

  <!-- 1組: min=5(112), Q1=15(196), Med=25(280), Q3=35(364), max=45(448) -->
  <text x="38" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1組</text>
  <line x1="112" y1="68" x2="112" y2="96" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="112" y1="82" x2="196" y2="82" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="196" y="62" width="168" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="280" y1="62" x2="280" y2="102" stroke="#dc2626" stroke-width="3"/>
  <line x1="364" y1="82" x2="448" y2="82" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="448" y1="68" x2="448" y2="96" stroke="#1d4ed8" stroke-width="2.5"/>

  <!-- 2組: min=10(154), Q1=20(238), Med=30(322), Q3=35(364), max=50(490) -->
  <text x="38" y="156" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">2組</text>
  <line x1="154" y1="138" x2="154" y2="166" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="154" y1="152" x2="238" y2="152" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="238" y="132" width="126" height="40" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="322" y1="132" x2="322" y2="172" stroke="#dc2626" stroke-width="3"/>
  <line x1="364" y1="152" x2="490" y2="152" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="490" y1="138" x2="490" y2="166" stroke="#0f766e" stroke-width="2.5"/>
</svg>
