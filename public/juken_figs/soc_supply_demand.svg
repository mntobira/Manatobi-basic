<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>需要曲線・供給曲線と均衡価格の移動</title>
  <rect width="540" height="250" rx="12" fill="#fffdf9" stroke="#e4d9c5" stroke-width="2"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">【市場経済における需要曲線D・供給曲線Sと均衡価格】</text>

  <!-- グラフ軸 -->
  <line x1="65" y1="206" x2="310" y2="206" stroke="#334155" stroke-width="2.2"/>
  <line x1="65" y1="42" x2="65" y2="206" stroke="#334155" stroke-width="2.2"/>
  <text x="38" y="125" text-anchor="middle" font-size="12" font-weight="800" fill="#334155" transform="rotate(-90 38 125)">価格（円）</text>
  <text x="188" y="232" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">取引量（数量）</text>

  <!-- 供給曲線 S (右上がり) -->
  <line x1="88" y1="188" x2="275" y2="58" stroke="#0f766e" stroke-width="3"/>
  <text x="284" y="58" font-size="12.5" font-weight="800" fill="#0f766e">供給曲線 S</text>

  <!-- 需要曲線 D1 (右下がり) -->
  <line x1="88" y1="62" x2="252" y2="192" stroke="#2563eb" stroke-width="3"/>
  <text x="255" y="198" font-size="12" font-weight="800" fill="#2563eb">需要 D₁</text>

  <!-- 需要増加 D2 (右へシフト) -->
  <line x1="130" y1="54" x2="294" y2="184" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="296" y="176" font-size="12" font-weight="800" fill="#dc2626">需要 D₂</text>

  <!-- シフト矢印 -->
  <line x1="145" y1="106" x2="180" y2="106" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="184,106 175,101 175,111" fill="#dc2626"/>

  <!-- 均衡点 E1 (intersection of S and D1 ~ (171, 130)) -->
  <circle cx="170" cy="131" r="5" fill="#1d4ed8"/>
  <line x1="65" y1="131" x2="170" y2="131" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="55" y="135" text-anchor="end" font-size="11.5" font-weight="800" fill="#1d4ed8">P₁</text>
  <text x="163" y="148" font-size="12" font-weight="800" fill="#1d4ed8">E₁</text>

  <!-- 新均衡点 E2 (intersection of S and D2 ~ (196, 113)) -->
  <circle cx="198" cy="111" r="5" fill="#dc2626"/>
  <line x1="65" y1="111" x2="198" y2="111" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="55" y="115" text-anchor="end" font-size="11.5" font-weight="800" fill="#dc2626">P₂</text>
  <text x="206" y="116" font-size="12" font-weight="800" fill="#dc2626">E₂</text>

  <!-- 右側解説ボックス -->
  <rect x="330" y="45" width="194" height="180" rx="10" fill="#fdf9f2" stroke="#c7771e" stroke-width="1.5"/>
  <text x="427" y="67" text-anchor="middle" font-size="12.5" font-weight="800" fill="#9b5910">曲線の見分け方と移動</text>
  <line x1="342" y1="75" x2="512" y2="75" stroke="#f3d5ae" stroke-width="1.5"/>
  <text x="342" y="96" font-size="11.5" font-weight="800" fill="#2563eb">● 需要曲線 D（買い手）</text>
  <text x="350" y="113" font-size="10.5" fill="#334155">安いほど買いたい → 右下がり</text>
  <text x="342" y="136" font-size="11.5" font-weight="800" fill="#0f766e">● 供給曲線 S（売り手）</text>
  <text x="350" y="153" font-size="10.5" fill="#334155">高いほど売りたい → 右上がり</text>
  <text x="342" y="178" font-size="11.5" font-weight="800" fill="#dc2626">★ 人気上昇で需要が増えると</text>
  <text x="350" y="195" font-size="10.5" font-weight="700" fill="#991b1b">D₁→D₂へ右移動し、均衡価格は</text>
  <text x="350" y="210" font-size="10.5" font-weight="800" fill="#991b1b">P₁ → P₂ へ【上昇】する！</text>
</svg>
