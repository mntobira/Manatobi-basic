  <circle cx="282.0" cy="222.0" r="5" fill="#7c3aed"/>
  <text x="40.0" y="214.0" font-size="14" font-weight="800" fill="#1e293b">A(-2, 2)</text>
  <text x="382.0" y="65.0" font-size="14" font-weight="800" fill="#1e293b">B(4, 8)</text>
  <text x="292.0" y="238.0" font-size="14" font-weight="900" fill="#6d28d9">点P (x&gt;0)</text>
  <text x="174.0" y="294.0" font-size="14" font-weight="800" fill="#1e293b">O</text>
  <text x="32" y="38" font-size="14" font-weight="800" fill="#1e293b">y = ½x²（△PAB = △OAB となる点P）</text>

  <!-- Parallel line through O with slope 1: y = x => intersects y=1/2 x^2 at P(2,2) -->
  <polygon points="282.0,222.0 98.0,222.0 374.0,60.0" fill="#bbf7d0" fill-opacity="0.55" stroke="#16a34a" stroke-width="2.2"/>
  <line x1="134.8" y1="308.4" x2="383.2" y2="162.6" stroke="#dc2626" stroke-width="2.6" stroke-dasharray="6,4"/>
  <text x="278" y="216" font-size="12.5" font-weight="900" fill="#dc2626">✏️ 等積変形：Oを通りAB(傾き1)に平行！</text>
  <rect x="262" y="226" width="246" height="62" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="272" y="247" font-size="12.5" font-weight="800" fill="#1e293b">平行線の式 y = x と y = ½x² を連立</text>
  <text x="272" y="269" font-size="13.5" font-weight="900" fill="#dc2626">½x² = x ⇒ x = 2 ⇒ P(2, 2)</text>

</svg>
