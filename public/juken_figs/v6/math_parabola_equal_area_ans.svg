  <polygon points="190.0,276.0 98.0,222.0 374.0,60.0" fill="#e0e7ff" fill-opacity="0.55" stroke="#4338ca" stroke-width="1.8"/>
  <polyline points="-3.2,37.9 6.0,60.0 15.2,81.1 24.4,101.0 33.6,119.9 42.8,137.8 52.0,154.5 61.2,170.2 70.4,184.7 79.6,198.2 88.8,210.7 98.0,222.0 107.2,232.3 116.4,241.4 125.6,249.5 134.8,256.6 144.0,262.5 153.2,267.4 162.4,271.1 171.6,273.8 180.8,275.5 190.0,276.0 199.2,275.5 208.4,273.8 217.6,271.1 226.8,267.4 236.0,262.5 245.2,256.6 254.4,249.5 263.6,241.4 272.8,232.3 282.0,222.0 291.2,210.7 300.4,198.2 309.6,184.7 318.8,170.2 328.0,154.5 337.2,137.8 346.4,119.9 355.6,101.0 364.8,81.1 374.0,60.0 383.2,37.9 392.4,14.6" fill="none" stroke="#1e293b" stroke-width="2.4"/>
  <line x1="52.0" y1="249.0" x2="392.4" y2="49.2" stroke="#1d4ed8" stroke-width="2"/>
