<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" style="font-family:system-ui, -apple-system, 'Noto Sans JP', sans-serif;background:#ffffff">

  <line x1="25" y1="276.0" x2="462" y2="276.0" stroke="#334155" stroke-width="2"/>
