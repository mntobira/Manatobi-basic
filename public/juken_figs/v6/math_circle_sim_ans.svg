  <text x="322" y="79" font-size="12.5" font-weight="900" fill="#92400e">✏️ 円と相似 2大チェック！</text>
  <text x="322" y="105" font-size="12" font-weight="900" fill="#dc2626">① 直径ABに対する円周角</text>
