  <text x="273" y="238" font-size="12.5" font-weight="800" fill="#1e293b">△OAB = ½ × 底辺4 × (2 + 4)</text>
  <text x="273" y="258" font-size="13.5" font-weight="900" fill="#dc2626">　　　= ½ × 4 × 6 = 12</text>

