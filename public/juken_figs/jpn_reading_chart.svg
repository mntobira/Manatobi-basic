<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 245" width="540" height="245" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>中学生300人に聞いた地域ボランティア参加のグラフ（国語・資料活用と条件作文）</title>
  <rect width="540" height="245" rx="12" fill="#fffdf9" stroke="#e4d9c5" stroke-width="2"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">【資料：緑ヶ丘中学校の全校生徒300人アンケート結果】</text>

  <!-- 資料1：参加経験と今後の意欲 -->
  <rect x="18" y="38" width="244" height="190" rx="10" fill="#fdf6f6" stroke="#f3c3c1" stroke-width="1.5"/>
  <text x="140" y="58" text-anchor="middle" font-size="12.5" font-weight="800" fill="#9b332f">【資料1】地域の清掃・行事への参加経験</text>

  <!-- 横帯グラフ (width 200px) -->
  <rect x="40" y="76" width="68" height="34" fill="#dc2626"/>
  <rect x="108" y="76" width="104" height="34" fill="#f59e0b"/>
  <rect x="212" y="76" width="28" height="34" fill="#94a3b8"/>
  <text x="74" y="97" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff">34%</text>
  <text x="160" y="97" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ffffff">52%</text>
  <text x="226" y="97" text-anchor="middle" font-size="10.5" font-weight="800" fill="#ffffff">14%</text>

  <g font-size="11" font-weight="700" fill="#1e293b">
    <rect x="36" y="126" width="11" height="11" fill="#dc2626"/>
    <text x="53" y="136">参加したことがある（34%）</text>
    <rect x="36" y="148" width="11" height="11" fill="#f59e0b"/>
    <text x="53" y="158">未参加だが興味はある（52%）</text>
    <rect x="36" y="170" width="11" height="11" fill="#94a3b8"/>
    <text x="53" y="180">あまり興味がない（14%）</text>
  </g>
  <text x="140" y="212" text-anchor="middle" font-size="11" font-weight="800" fill="#9b332f">→ 計86%が「経験あり」または「興味あり」！</text>

  <!-- 資料2：参加できなかった理由（複数回答） -->
  <rect x="276" y="38" width="246" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="399" y="58" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e293b">【資料2】参加しなかった主な理由（上位3つ）</text>

  <!-- 1位 日時や募集場所を知らなかった 64% -->
  <text x="290" y="84" font-size="11" font-weight="700" fill="#1e293b">① 日時や申込方法を知らなかった</text>
  <rect x="290" y="90" width="160" height="16" rx="4" fill="#2563eb"/>
  <text x="456" y="102" font-size="11.5" font-weight="800" fill="#1d4ed8">64%</text>

  <!-- 2位 1人で参加するのが不安だった 48% -->
  <text x="290" y="128" font-size="11" font-weight="700" fill="#1e293b">② 1人で参加するのが不安だった</text>
  <rect x="290" y="134" width="120" height="16" rx="4" fill="#0f766e"/>
  <text x="416" y="146" font-size="11.5" font-weight="800" fill="#0f766e">48%</text>

  <!-- 3位 部活動や予定と重なった 35% -->
  <text x="290" y="172" font-size="11" font-weight="700" fill="#1e293b">③ 部活動などの予定と重なった</text>
  <rect x="290" y="178" width="88" height="16" rx="4" fill="#64748b"/>
  <text x="384" y="190" font-size="11.5" font-weight="800" fill="#475569">35%</text>

  <text x="399" y="215" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">（※ 未参加の生徒198人を対象・複数回答可）</text>
</svg>
