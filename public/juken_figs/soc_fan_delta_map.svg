<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>扇状地と三角州の地形図と主な地図記号</title>
  <rect width="540" height="250" rx="12" fill="#fffdf9" stroke="#e4d9c5" stroke-width="2"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">【河川がつくる地形（A：扇状地 ／ B：三角州）と頻出地図記号】</text>

  <!-- 左：地形模式図 -->
  <g transform="translate(18, 38)">
    <rect x="0" y="0" width="295" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- 山地 -->
    <polygon points="12,95 62,25 112,95" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="62" y="76" text-anchor="middle" font-size="11.5" font-weight="800" fill="#14532d">山地</text>

    <!-- 扇状地 A -->
    <path d="M 85 75 L 175 45 Q 192 98 175 150 L 85 112 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="140" y="92" text-anchor="middle" font-size="12.5" font-weight="800" fill="#92400e">地形A：扇状地</text>
    <text x="140" y="108" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">水はけが良い→果樹園</text>

    <!-- 川 -->
    <path d="M 62 60 Q 130 95 225 118" fill="none" stroke="#0284c7" stroke-width="4" stroke-dasharray="6 3"/>

    <!-- 海と三角州 B -->
    <rect x="232" y="22" width="52" height="162" rx="6" fill="#bae6fd"/>
    <text x="262" y="55" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">海</text>
    <polygon points="195,112 242,82 242,155" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="216" y="173" text-anchor="middle" font-size="12" font-weight="800" fill="#3f6212">地形B：三角州</text>
    <text x="150" y="187" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3f6212">河口に細かい土砂→水持ちが良く水田（稲作）</text>
  </g>

  <!-- 右：頻出地図記号一覧 -->
  <g transform="translate(325, 38)">
    <rect x="0" y="0" width="198" height="196" rx="10" fill="#fffaf0" stroke="#e4d9c5" stroke-width="1.5"/>
    <text x="99" y="22" text-anchor="middle" font-size="12.5" font-weight="800" fill="#78350f">入試必出！土地利用の地図記号</text>
    <line x1="12" y1="30" x2="186" y2="30" stroke="#e4d9c5" stroke-width="1.5"/>

    <!-- 果樹園 -->
    <circle cx="34" cy="54" r="9" fill="none" stroke="#1e293b" stroke-width="2"/>
    <line x1="34" y1="45" x2="34" y2="38" stroke="#1e293b" stroke-width="2"/>
    <text x="62" y="58" font-size="12" font-weight="800" fill="#1e293b">果樹園（扇状地に多い）</text>

    <!-- 田 -->
    <line x1="27" y1="80" x2="27" y2="94" stroke="#1e293b" stroke-width="2"/>
    <line x1="41" y1="80" x2="41" y2="94" stroke="#1e293b" stroke-width="2"/>
    <text x="62" y="91" font-size="12" font-weight="800" fill="#1e293b">田（三角州・低地に多い）</text>

    <!-- 畑 -->
    <path d="M 25 112 L 34 123 L 43 112" fill="none" stroke="#1e293b" stroke-width="2"/>
    <text x="62" y="122" font-size="12" font-weight="800" fill="#1e293b">畑（台地に多い：V字）</text>

    <!-- 茶畑 -->
    <circle cx="34" cy="143" r="2.8" fill="#1e293b"/>
    <circle cx="28" cy="153" r="2.8" fill="#1e293b"/>
    <circle cx="40" y="153" cy="153" r="2.8" fill="#1e293b"/>
    <text x="62" y="153" font-size="12" font-weight="800" fill="#1e293b">茶畑（静岡・鹿児島台地）</text>

    <!-- 広葉樹林 vs 針葉樹林 -->
    <text x="16" y="182" font-size="10.5" font-weight="700" fill="#57534e">※ 2万5千分の1地形図の主曲線＝10m間隔</text>
  </g>
</svg>
