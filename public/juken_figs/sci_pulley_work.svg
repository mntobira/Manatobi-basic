<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>滑車・斜面を使った仕事と仕事率の比較</title>
  <rect width="540" height="250" rx="12" fill="#fffdf9" stroke="#e4d9c5" stroke-width="2"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">【仕事の原理：動滑車と斜面の比較（摩擦・器具の重さは無視）】</text>

  <!-- 左：動滑車 -->
  <g transform="translate(18, 36)">
    <rect x="0" y="0" width="242" height="198" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="121" y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#1e40af">実験1：動滑車で 0.5 m 引き上げる</text>
    <!-- 天井 -->
    <line x1="45" y1="40" x2="195" y2="40" stroke="#334155" stroke-width="4"/>
    <!-- ひも -->
    <line x1="88" y1="40" x2="88" y2="115" stroke="#475569" stroke-width="2.5"/>
    <line x1="132" y1="52" x2="132" y2="115" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="132,46 126,57 138,57" fill="#dc2626"/>
    <text x="176" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">引く力 F₁</text>
    <text x="176" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">ひもを引く長さ</text>
    <text x="176" y="98" text-anchor="middle" font-size="11" font-weight="800" fill="#991b1b">2倍（1.0 m）</text>

    <!-- 動滑車本体 -->
    <circle cx="110" cy="115" r="22" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
    <circle cx="110" cy="115" r="4" fill="#334155"/>
    <line x1="110" y1="115" x2="110" y2="146" stroke="#334155" stroke-width="2.5"/>

    <!-- 物体 20N -->
    <rect x="82" y="146" width="56" height="36" rx="5" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="110" y="169" text-anchor="middle" font-size="13" font-weight="800" fill="#854d0e">20 N</text>
    <text x="44" y="168" text-anchor="middle" font-size="11" font-weight="800" fill="#0f766e">高さ 0.5 m</text>
  </g>

  <!-- 右：なめらかな斜面 -->
  <g transform="translate(278, 36)">
    <rect x="0" y="0" width="244" height="198" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="122" y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e">実験2：斜面で高さ 0.5 m まで引く</text>
    <!-- 斜面三角形 -->
    <polygon points="26,172 206,172 206,82" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="223" y="132" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f766e">0.5 m</text>
    <text x="108" y="114" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b" transform="rotate(-26 108 114)">斜面の長さ 2.0 m</text>

    <!-- 台車 20N -->
    <g transform="translate(95, 128) rotate(-26.5)">
      <rect x="-24" y="-22" width="48" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
      <text x="0" y="-7" text-anchor="middle" font-size="11.5" font-weight="800" fill="#854d0e">20 N</text>
      <line x1="24" y1="-11" x2="64" y2="-11" stroke="#dc2626" stroke-width="2.5"/>
      <polygon points="68,-11 59,-16 59,-6" fill="#dc2626"/>
    </g>
    <text x="165" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">引く力 F₂</text>
    <text x="122" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">どちらも仕事の大きさ W ＝ 20N × 0.5m ＝ 10 J</text>
  </g>
</svg>
