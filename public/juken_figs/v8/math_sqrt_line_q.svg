<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="540" height="300" rx="14" fill="#ffffff"/>

  <text x="18" y="25" font-size="13" font-weight="800" fill="#0f172a">数直線上の区間 ア〜エ と 3√5 の大きさ・整数部分</text>
  <line x1="35" y1="138" x2="508" y2="138" stroke="#0f172a" stroke-width="2.4" marker-end="url(#arr-slate)"/>
  
  <line x1="60" y1="128" x2="60" y2="148" stroke="#0f172a" stroke-width="2.4"/>
  <text x="60" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">4</text>
<line x1="112.5" y1="133" x2="112.5" y2="143" stroke="#64748b" stroke-width="1.5"/>
  <line x1="165" y1="128" x2="165" y2="148" stroke="#0f172a" stroke-width="2.4"/>
  <text x="165" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">5</text>
<line x1="217.5" y1="133" x2="217.5" y2="143" stroke="#64748b" stroke-width="1.5"/>
  <line x1="270" y1="128" x2="270" y2="148" stroke="#0f172a" stroke-width="2.4"/>
  <text x="270" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">6</text>
<line x1="322.5" y1="133" x2="322.5" y2="143" stroke="#64748b" stroke-width="1.5"/>
  <line x1="375" y1="128" x2="375" y2="148" stroke="#0f172a" stroke-width="2.4"/>
  <text x="375" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">7</text>
<line x1="427.5" y1="133" x2="427.5" y2="143" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="128" x2="480" y2="148" stroke="#0f172a" stroke-width="2.4"/>
  <text x="480" y="170" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">8</text>

  <!-- 区間ラベル ア(4-5), イ(5-6), ウ(6-7), エ(7-8) -->
  <text x="112" y="196" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">区間ア</text>
  <text x="217" y="196" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">区間イ</text>
  <text x="322" y="196" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">区間ウ</text>
  <text x="427" y="196" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">区間エ</text>
  

</svg>
