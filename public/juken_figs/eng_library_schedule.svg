<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 245" width="540" height="245" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <title>Green City Library Poster and Train Timetable</title>
  <rect width="540" height="245" rx="12" fill="#f4f8fe" stroke="#bbd2f2" stroke-width="2"/>
  <rect x="16" y="14" width="508" height="36" rx="8" fill="#2458a6"/>
  <text x="270" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Green City Library — Summer Science Event</text>

  <!-- Left: Event Info & Fee -->
  <rect x="16" y="60" width="242" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="82" font-size="13" font-weight="800" fill="#1e3a8a">Event Information</text>
  <line x1="28" y1="90" x2="246" y2="90" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="110" font-size="11.5" font-weight="700" fill="#1e293b">Date: Saturday, August 8</text>
  <text x="30" y="129" font-size="11.5" font-weight="700" fill="#1e293b">Time: 10:30 a.m. – 12:00 p.m.</text>
  <text x="30" y="148" font-size="11.5" font-weight="800" fill="#dc2626">* Doors open 15 minutes before start</text>
  <text x="30" y="172" font-size="12" font-weight="800" fill="#0f766e">Tickets:</text>
  <text x="38" y="190" font-size="11.5" fill="#334155">• Adults: $8 each</text>
  <text x="38" y="207" font-size="11.5" fill="#334155">• Junior high students &amp; under: $4</text>
  <text x="38" y="223" font-size="10.5" font-weight="800" fill="#b45309">* Group of 4 or more people: $2 off total!</text>

  <!-- Right: Bus Schedule from Central Station -->
  <rect x="272" y="60" width="252" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="398" y="82" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">Bus Schedule (Central Sta. → Library)</text>
  <line x1="284" y1="90" x2="512" y2="90" stroke="#e2e8f0" stroke-width="1.5"/>
  <g font-size="11.5" font-weight="800" fill="#475569">
    <text x="308" y="109" text-anchor="middle">Bus</text>
    <text x="388" y="109" text-anchor="middle">Leave Sta.</text>
    <text x="472" y="109" text-anchor="middle">Arrive Lib.</text>
  </g>
  <line x1="284" y1="115" x2="512" y2="115" stroke="#cbd5e1" stroke-width="1"/>
  <g font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">
    <text x="308" y="135">No. 1</text><text x="388" y="135">9:35 a.m.</text><text x="472" y="135">9:55 a.m.</text>
    <text x="308" y="157">No. 2</text><text x="388" y="157">9:50 a.m.</text><text x="472" y="157">10:10 a.m.</text>
    <text x="308" y="179">No. 3</text><text x="388" y="179">10:05 a.m.</text><text x="472" y="179">10:25 a.m.</text>
    <text x="308" y="201">No. 4</text><text x="388" y="201">10:20 a.m.</text><text x="472" y="201">10:40 a.m.</text>
  </g>
  <text x="398" y="221" text-anchor="middle" font-size="10.5" font-weight="700" fill="#64748b">(5-minute walk from Library Bus Stop to Hall)</text>
</svg>
